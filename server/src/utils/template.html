<table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 512px; margin: 0 auto; border-radius: 8px; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
    <!-- Header -->
    <tr>
        <td style="background: linear-gradient(135deg, #0b6815 10%, #0e7490 100%); padding: 32px 24px; text-align: center;">
            <h1 style="margin: 0; color: #ffffff; font-size: 26px; font-weight: 600; letter-spacing: 1px; font-family: Arial, Helvetica, sans-serif; text-shadow: 2px 3px 10px rgba(0,0,0,0.75);">VIRTUAL CLASSROOM</h1>
        </td>
    </tr>
    
    <!-- Body Content -->
    <tr>
        <td style="padding: 40px 32px; color: #334155; line-height: 1.6; font-size: 16px; font-family: 'Times New Roman', Times, serif;">
            <!-- Title -->
            <h2 style="margin-top: 0; color: #0f766e; font-size: 20px; font-weight: 600; margin-bottom: 16px;">${title}</h2>
            
            <!-- Greeting -->
            <p style="margin: 0 0 16px 0;">Hello <strong>${userName}</strong>,</p>
            
            <!-- Dynamic Content Injection -->
            <div style="width: 100%;">
                ${bodyContent}
            </div>
            
            <!-- Sign off -->
            <p style="margin-top: 32px; margin-bottom: 0; border-top: 1px solid #e2e8f0; padding-top: 24px; font-size: 15px;">
                Best regards,<br>
                <span style="font-weight: 600; color: #0e7490;">The Virtual Classroom Team</span>
            </p>
        </td>
    </tr>
    
    <!-- Footer -->
    <tr>
        <td style="background-color: #e2e8f0; padding: 24px; text-align: center; color: #64748b; font-size: 13px; border-top: 1px solid #cbd5e1;">
            <p style="margin: 4px 0;">This is an automated mail from the Virtual Classroom.</p>
            <p style="margin: 4px 0;">&copy; 2026-${currentYear} Virtual Classroom. All rights reserved.</p>
        </td>
    </tr>
</table>
