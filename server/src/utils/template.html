<table
    border="0"
    cellpadding="0"
    cellspacing="0"
    width="100%"
    style="
        max-width: 600px;
        margin: 0 auto;
        background-color: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    "
>
    <tr>
        <td
            style="
                background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
                padding: 36px 24px;
                text-align: center;
            "
        >
            <h1
                style="
                    margin: 0;
                    color: #ffffff;
                    font-size: 24px;
                    font-weight: 700;
                    letter-spacing: 2px;
                    text-transform: uppercase;
                "
            >
                Virtual Classroom
            </h1>
        </td>
    </tr>

    <tr>
        <td
            style="
                padding: 40px;
                color: #334155;
                line-height: 1.6;
                font-size: 16px;
            "
        >
            <h2
                style="
                    margin-top: 0;
                    color: #1e40af;
                    font-size: 20px;
                    font-weight: 600;
                    margin-bottom: 24px;
                "
            >
                ${title}
            </h2>

            <p style="margin: 0 0 20px 0;">
                Dear <strong>${userName}</strong>,
            </p>

            <div style="width: 100%; margin-bottom: 32px;">
                ${bodyContent}
            </div>

            <div
                style="
                    margin-top: 32px;
                    border-top: 1px solid #e2e8f0;
                    padding-top: 24px;
                    font-size: 15px;
                    color: #475569;
                "
            >
                <p style="margin: 0 0 4px 0;">Sincerely,</p>
                <p style="margin: 0; font-weight: 600; color: #1e40af;">
                    The Virtual Classroom Team
                </p>
            </div>
        </td>
    </tr>

    <tr>
        <td
            style="
                background-color: #f8fafc;
                padding: 24px;
                text-align: center;
                color: #64748b;
                font-size: 13px;
                line-height: 1.5;
                border-top: 1px solid #e2e8f0;
            "
        >
            <p style="margin: 0 0 8px 0;">
                This is an automated message from the Virtual Classroom platform. Please do not reply directly to this email.
            </p>
            <p style="margin: 0;">
                &copy; 2026-${currentYear} Virtual Classroom. All rights reserved.
            </p>
        </td>
    </tr>
</table>
